name: meeting-01-homework-observability

volumes:
  nginx_logs:

services:
  grafana:
    image: grafana/grafana:12.3.1
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - "./grafana/provisioning:/etc/grafana/provisioning"
    depends_on:
      - mimir
      - loki

  mimir:
    image: grafana/mimir:2.17.4
    command: ["-ingester.native-histograms-ingestion-enabled=true", "-config.file=/etc/mimir.yaml"]
    ports:
      - "9009:9009"
    volumes:
      - "./mimir/mimir.yaml:/etc/mimir.yaml"

  loki:
    image: grafana/loki:3.6.3
    command: ["--pattern-ingester.enabled=true", "-config.file=/etc/loki/loki.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - "./loki/loki.yaml:/etc/loki/loki.yaml"

  alloy:
    image: grafana/alloy:v1.12.1
    command: [
      "run",
      "--server.http.listen-addr=0.0.0.0:12345",
      "/etc/alloy/config.alloy"
    ]
    ports:
      - "12347:12345"
    volumes:
      - "./alloy/config.alloy:/etc/alloy/config.alloy"
      - "./alloy/endpoints.json:/etc/alloy/endpoints.json"
      - "nginx_logs:/var/log/nginx:ro"
    depends_on:
      - loki
      - mimir

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - "./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
      - "nginx_logs:/var/log/nginx"

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.1
    command:
      - "--nginx.scrape-uri=http://nginx/nginx_status"
    ports:
      - "9113:9113"
    depends_on:
      - nginx

  loadgen:
    image: curlimages/curl:8.8.0
    restart: unless-stopped
    command: ["/bin/sh", "/scripts/generate.sh"]
    volumes:
      - "./loadgen/generate.sh:/scripts/generate.sh:ro"
    depends_on:
      - nginx
